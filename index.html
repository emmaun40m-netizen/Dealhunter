<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>DealHunter AI — Autonomous Real Estate Multi-Agent Intelligence</title>
    <meta name="description" content="Autonomous multi-agent real estate intelligence, live script engine, national property scanner, and virtual title closer." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10B981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DealHunter AI" />
    <meta name="application-name" content="DealHunter AI" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="DealHunter AI — Autonomous Real Estate Intelligence" />
    <meta property="og:description" content="Autonomous multi-agent real estate intelligence, live script engine, national property scanner, and virtual title closer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#0B0E14] text-slate-100 antialiased selection:bg-emerald-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('DealHunter PWA ServiceWorker registered successfully:', registration.scope);
            },
            (err) => {
              console.log('DealHunter PWA ServiceWorker registration notice:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
